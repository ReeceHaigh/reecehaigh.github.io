<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<title>Radio Stations - Reece Haigh</title>
<meta name="description" content="A personal collection of internet radio streams.">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/tools/tools.css">
<style>
  body { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }

  .search { max-width: 480px; margin: 0 0 8px; }
  .search input {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    background: #0f1216;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    font: inherit;
    font-size: 15px;
  }
  .search input::placeholder { color: var(--muted); }
  .search input::-webkit-search-cancel-button { filter: invert(.7); }

  .category { margin-top: 32px; }
  .category h2 {
    margin: 0 0 14px;
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .stations { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

  .station {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    padding: 14px 16px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  .station:hover { border-color: var(--accent); }
  .station.playing { border-color: var(--accent); background: rgba(110, 231, 183, .07); }
  .station.loading { border-color: rgba(110, 231, 183, .5); }
  .station.error .desc { color: var(--danger); }

  .station .ico {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 13px;
    line-height: 1;
  }
  .station.playing .ico { background: var(--accent); border-color: var(--accent); color: #06251b; }
  .station.loading .ico { color: var(--accent); border-color: var(--accent); }

  .station .info { min-width: 0; flex: 1; }
  .station .name { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .station .desc { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty { color: var(--muted); text-align: center; padding: 40px 0; }

  #now-playing {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 50;
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    visibility: hidden;
    transition: transform .2s ease, visibility 0s linear .2s;
  }
  #now-playing.visible { transform: translateY(0); visibility: visible; transition: transform .2s ease; }
  #now-playing .bar { max-width: 960px; margin: 0 auto; display: flex; align-items: center; gap: 16px; }

  .np-meta { flex: 1; min-width: 0; }
  .np-status { color: var(--muted); font-size: 12px; }
  .np-status.err { color: var(--danger); }
  .np-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #np-open { display: none; font-size: 13px; color: var(--accent); margin-top: 2px; }
  #np-open.show { display: inline-block; }

  .np-volume { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  .np-volume input[type="range"] { width: 100px; }

  #np-stop {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font-size: 13px;
  }
  #np-stop:hover { border-color: var(--accent); }

  @media (max-width: 560px) { .np-volume { display: none; } }
  @media (prefers-reduced-motion: reduce) { #now-playing, #now-playing.visible { transition: none; } }
</style>
</head>
<body>

  <header class="topbar">
    <div class="wrap">
      <a class="home" href="/">reecehaigh.com</a>
      <a href="/">&larr; Home</a>
    </div>
  </header>

  <main class="wrap tool">
    <div class="page-head">
      <span class="eyebrow">Radio</span>
      <h1 class="title">Radio Stations</h1>
      <p class="lead">A personal collection of internet radio streams. Tap a station to play.</p>
    </div>

    <div class="search">
      <input id="search" type="search" placeholder="Search stations..." autocomplete="off" aria-label="Search stations">
    </div>

    <div id="stations-root"></div>
  </main>

  <audio id="audio" preload="none"></audio>

  <div id="now-playing" role="region" aria-label="Now playing">
    <div class="bar">
      <div class="np-meta">
        <div class="np-status" id="np-status" role="status" aria-live="polite">Stopped</div>
        <div class="np-title" id="np-title"></div>
        <a id="np-open" href="#" target="_blank" rel="noopener noreferrer">Open stream in a new tab</a>
      </div>
      <label class="np-volume">Vol <input id="np-volume" type="range" min="0" max="100" value="80" aria-label="Volume"></label>
      <button id="np-stop" type="button" title="Stop" aria-label="Stop">&#9632;</button>
    </div>
  </div>

<script>
(function () {
  var SECURE = location.protocol === 'https:';

  var CATEGORIES = [
    {
      name: "Pride & LGBT+",
      stations: [
        { name: "Hits Radio Pride", desc: "24/7", url: "https://stream-al.planetradio.co.uk/hitsradiopride.aac" },
        { name: "Pride Radio", desc: "Newcastle, UK", url: "https://richkell.radioca.st/stream.mp3" },
        { name: "Gaydio", desc: "Manchester, UK", url: "https://listen-gaydio.sharp-stream.com/gaydioukhq.mp3" }
      ]
    },
    {
      name: "Hits & Pop",
      stations: [
        { name: "977 Today's Hits", desc: "Florida, USA", url: "https://17563.live.streamtheworld.com/977_HITS_SC" },
        { name: "Exclusive Chart", desc: "Today's biggest hits, non stop", url: "https://streaming.exclusive.radio/er/chart/icecast.audio" }
      ]
    },
    {
      name: "Heart Decades",
      stations: [
        { name: "Heart 00s", desc: "2000s", url: "https://media-ssl.musicradio.com/Heart00sMP3" },
        { name: "Heart 90s", desc: "1990s", url: "https://media-ssl.musicradio.com/Heart90sMP3" },
        { name: "Heart 80s", desc: "1980s", url: "https://media-ssl.musicradio.com/Heart80sMP3" }
      ]
    },
    {
      name: "Exclusive Radio - Artists",
      stations: [
        { name: "Ariana Grande", desc: "Non stop Ariana Grande", url: "https://streaming.exclusive.radio/er/arianagrande/icecast.audio" },
        { name: "Maroon 5", desc: "Non stop Maroon 5", url: "https://streaming.exclusive.radio/er/maroon5/icecast.audio" },
        { name: "Lady Gaga", desc: "Non stop Lady Gaga", url: "https://streaming.exclusive.radio/er/ladygaga/icecast.audio" },
        { name: "Nicki Minaj", desc: "Non stop Nicki Minaj", url: "https://streaming.exclusive.radio/er/nickiminaj/icecast.audio" },
        { name: "George Michael", desc: "Non stop George Michael", url: "https://streaming.exclusive.radio/er/georgemichael/icecast.audio" },
        { name: "Rihanna", desc: "Non stop Rihanna", url: "https://streaming.exclusive.radio/er/rihanna/icecast.audio" }
      ]
    },
    {
      name: "Exclusive Radio - Decades",
      stations: [
        { name: "Exclusive 2020s", desc: "Hits from 2020 to now", url: "https://streaming.exclusive.radio/er/2020/icecast.audio" },
        { name: "Exclusive 2010s", desc: "Hits from 2010 to 2019", url: "https://streaming.exclusive.radio/er/10s/icecast.audio" },
        { name: "Exclusive 2000s", desc: "Hits from 2000 to 2009", url: "https://streaming.exclusive.radio/er/00s/icecast.audio" },
        { name: "Exclusive 1990s", desc: "Hits from 1990 to 1999", url: "https://streaming.exclusive.radio/er/90s/icecast.audio" },
        { name: "Exclusive 1980s", desc: "Hits from 1980 to 1989", url: "https://streaming.exclusive.radio/er/80s/icecast.audio" }
      ]
    },
    {
      name: "Other",
      stations: [
        { name: "Vocaloid Radio", desc: "World", url: "http://curiosity.shoutca.st:8019/128" },
        { name: "Aycliffe Radio", desc: "Community radio", url: "https://solid41.streamupsolutions.com/proxy/catidbxp?mp=/;type=aac" },
        { name: "Exclusive Country", desc: "All classic country, all the time", url: "https://streaming.exclusive.radio/er/country/icecast.audio" },
        { name: "Radio 1190", desc: "KVCU, Boulder, CO", url: "http://radio1190.colorado.edu:8000/high.mp3" },
        { name: "Fallout 4 Radio", desc: "In-game style radio", url: "http://fallout.fm:8000/falloutfm6.ogg" }
      ]
    }
  ];

  var CONNECT_TIMEOUT = 12000;   // ms to wait for a stream to start
  var MAX_RETRIES = 3;           // reconnect attempts after a stream that was playing drops

  // Storage can throw (private modes, blocked cookies), so never let it stop the page.
  var store = {
    get: function (k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  };

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio'), root = $('stations-root'), searchInput = $('search');
  var nowPlaying = $('now-playing'), npTitle = $('np-title'), npStatus = $('np-status'), npVolume = $('np-volume'), npOpen = $('np-open');
  var BASE_TITLE = document.title;

  var saved = parseInt(store.get('radio-volume'), 10);
  var vol = isNaN(saved) ? 80 : Math.max(0, Math.min(100, saved));
  audio.volume = vol / 100; npVolume.value = vol;

  // cur = { station, state: loading | playing | error, upgraded, everPlayed, retries }
  var cur = null, connectTimer = null, retryTimer = null;

  function isInsecure(station) { return /^http:/i.test(station.url); }

  // An http:// stream on an https:// page is blocked as mixed content, so try the https form
  // of the address first. If that fails, offer to open the stream directly instead.
  function sourceFor(station) {
    if (SECURE && isInsecure(station)) { cur.upgraded = true; return station.url.replace(/^http:/i, 'https:'); }
    return station.url;
  }

  // ---- rendering ----
  function render() {
    var q = searchInput.value.trim().toLowerCase(), any = false;
    root.textContent = '';
    CATEGORIES.forEach(function (cat) {
      var matches = cat.stations.filter(function (s) { return !q || s.name.toLowerCase().indexOf(q) >= 0 || s.desc.toLowerCase().indexOf(q) >= 0 || cat.name.toLowerCase().indexOf(q) >= 0; });
      if (!matches.length) return;
      any = true;
      var sec = document.createElement('section'); sec.className = 'category';
      var h = document.createElement('h2'); h.textContent = cat.name; sec.appendChild(h);
      var grid = document.createElement('div'); grid.className = 'stations';
      matches.forEach(function (s) { grid.appendChild(card(s)); });
      sec.appendChild(grid); root.appendChild(sec);
    });
    if (!any) { var p = document.createElement('p'); p.className = 'empty'; p.textContent = 'No stations match "' + searchInput.value + '".'; root.appendChild(p); }
    paint();
  }

  function card(station) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'station'; b.setAttribute('data-url', station.url);
    var ico = document.createElement('span'); ico.className = 'ico'; ico.setAttribute('aria-hidden', 'true'); ico.textContent = '▶';
    var info = document.createElement('span'); info.className = 'info';
    var n = document.createElement('span'); n.className = 'name'; n.textContent = station.name; n.style.display = 'block';
    var d = document.createElement('span'); d.className = 'desc'; d.textContent = station.desc; d.style.display = 'block';
    info.appendChild(n); info.appendChild(d); b.appendChild(ico); b.appendChild(info);
    b.addEventListener('click', function () { toggle(station); });
    return b;
  }

  function paint() {
    Array.prototype.forEach.call(root.querySelectorAll('.station'), function (el) {
      var mine = cur && cur.station.url === el.getAttribute('data-url'), st = mine ? cur.state : 'stopped';
      el.classList.toggle('playing', st === 'playing');
      el.classList.toggle('loading', st === 'loading');
      el.classList.toggle('error', st === 'error');
      el.querySelector('.ico').textContent = st === 'playing' ? '■' : st === 'loading' ? '⋯' : '▶';
      var name = el.querySelector('.name').textContent;
      el.setAttribute('aria-label', (st === 'playing' || st === 'loading' ? 'Stop ' : 'Play ') + name);
    });
  }

  function status(text, isErr) { npStatus.textContent = text; npStatus.className = 'np-status' + (isErr ? ' err' : ''); }

  // ---- playback ----
  function clearTimers() { clearTimeout(connectTimer); clearTimeout(retryTimer); connectTimer = retryTimer = null; }

  function toggle(station) {
    if (cur && cur.station.url === station.url && cur.state !== 'error') { stop(); return; }
    play(station);
  }

  function play(station) {
    clearTimers();
    cur = { station: station, state: 'loading', upgraded: false, everPlayed: false, retries: 0 };
    npTitle.textContent = station.name; npOpen.classList.remove('show');
    status('Connecting...'); nowPlaying.classList.add('visible');
    document.title = station.name + ' - Radio Stations';
    setMedia(station);
    start();
    paint();
  }

  function start() {
    if (!cur) return;
    var me = cur;
    cur.state = 'loading'; paint();
    clearTimeout(connectTimer);
    connectTimer = setTimeout(function () { if (cur === me && cur.state === 'loading') fail('timeout'); }, CONNECT_TIMEOUT);
    audio.pause();
    audio.src = sourceFor(cur.station);
    var p = audio.play();
    if (p && p.catch) p.catch(function (e) {
      if (cur !== me || (e && e.name === 'AbortError')) return;   // superseded by another station or a stop
      if (e && e.name === 'NotAllowedError') { status('Press a station to start playback.', true); cur.state = 'error'; paint(); return; }
      fail('rejected');
    });
  }

  function release() { audio.pause(); audio.removeAttribute('src'); audio.load(); }

  function fail() {
    if (!cur) return;
    clearTimeout(connectTimer);
    var st = cur.station;
    if (cur.everPlayed && cur.retries < MAX_RETRIES) {     // a live stream that dropped: reconnect
      cur.retries++; cur.state = 'loading'; paint();
      status('Connection lost. Reconnecting (' + cur.retries + '/' + MAX_RETRIES + ')...');
      var me = cur; release();
      retryTimer = setTimeout(function () { if (cur === me) start(); }, 1000 * cur.retries);
      return;
    }
    release();
    cur.state = 'error';
    if (SECURE && isInsecure(st) && !cur.everPlayed) {
      status('This station only has an insecure (http) stream, which browsers block on secure pages.', true);
      npOpen.href = st.url; npOpen.classList.add('show');
    } else {
      status(cur.everPlayed ? 'The stream has dropped. Press the station to try again.' : "Couldn't connect to this station.", true);
    }
    setPlaybackState('none');
    paint();
  }

  function stop() {
    clearTimers(); release();
    cur = null;
    status('Stopped'); npTitle.textContent = ''; npOpen.classList.remove('show');
    nowPlaying.classList.remove('visible');
    document.title = BASE_TITLE;
    setPlaybackState('none');
    paint();
  }

  audio.addEventListener('playing', function () {
    if (!cur) return;
    clearTimeout(connectTimer);
    cur.state = 'playing'; cur.everPlayed = true; cur.retries = 0;
    status('Playing'); setPlaybackState('playing'); paint();
  });
  audio.addEventListener('waiting', function () { if (cur && cur.state === 'playing') status('Buffering...'); });
  audio.addEventListener('error', function () { if (cur && cur.state !== 'error' && audio.getAttribute('src')) fail(); });
  audio.addEventListener('ended', function () { if (cur && cur.state === 'playing') fail(); });   // live streams should never end

  $('np-stop').addEventListener('click', stop);
  npVolume.addEventListener('input', function () { audio.volume = npVolume.value / 100; store.set('radio-volume', npVolume.value); });
  searchInput.addEventListener('input', render);

  // ---- lock screen / media key controls ----
  function setMedia(station) {
    if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
    try {
      navigator.mediaSession.metadata = new MediaMetadata({ title: station.name, artist: 'Radio Stations', album: 'reecehaigh.com' });
      navigator.mediaSession.setActionHandler('play', function () { if (cur && cur.state === 'error') play(cur.station); else if (cur) audio.play().catch(function () {}); });
      navigator.mediaSession.setActionHandler('pause', stop);   // a live stream can't be paused, only stopped
      navigator.mediaSession.setActionHandler('stop', stop);
    } catch (e) {}
  }
  function setPlaybackState(s) { try { if ('mediaSession' in navigator) navigator.mediaSession.playbackState = s; } catch (e) {} }

  render();
})();
</script>

</body>
</html>
