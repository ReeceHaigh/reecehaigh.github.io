<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b0d10">
<title>Metronome - Reece Haigh</title>
<meta name="description" content="A steady metronome with accents, subdivisions and tap tempo. Keeps time even in a background tab.">
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/tools/tools.css">
<style>
  .big { text-align: center; padding: 4px 0 8px; }
  .big .num { font-size: clamp(64px, 18vw, 110px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .big .name { color: var(--muted); letter-spacing: .1em; text-transform: uppercase; font-size: 13px; margin-top: 4px; }
  .bpmrow { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  .bpmrow input[type=range] { flex: 1; }
  .round { width: 44px; height: 44px; padding: 0; font-size: 22px; flex: none; }
  .beats { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 20px 0 4px; min-height: 36px; }
  .beat { width: 34px; height: 34px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--border); transition: background .06s, transform .06s, border-color .06s; }
  .beat.acc { border-color: #3a414c; }
  .beat.on { background: var(--accent); border-color: var(--accent); transform: scale(1.18); }
  .beat.on.acc { background: #7dd3fc; border-color: #7dd3fc; }
  #go { min-width: 140px; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .opts label.f { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
  select { width: 100%; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="home" href="/">reecehaigh.com</a>
      <a href="/tools/">&larr; All tools</a>
    </div>
  </header>

  <main class="wrap tool">
    <div class="page-head">
      <span class="eyebrow">Music</span>
      <h1 class="title">Metronome</h1>
      <p class="lead">A steady click with an accented first beat, optional subdivisions and tap tempo. It keeps time even when you switch to another tab.</p>
    </div>

    <div class="panel">
      <div class="big"><div class="num" id="bpmnum">100</div><div class="name" id="temponame">Andante</div></div>
      <div class="bpmrow">
        <button class="btn round" type="button" id="minus" aria-label="Slower">-</button>
        <input type="range" id="bpm" min="30" max="260" value="100" aria-label="Tempo in beats per minute">
        <button class="btn round" type="button" id="plus" aria-label="Faster">+</button>
      </div>
      <div class="beats" id="beats" aria-hidden="true"></div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn btn-primary" type="button" id="go">Start</button>
        <button class="btn" type="button" id="tap">Tap tempo</button>
      </div>
      <p class="muted small" style="text-align:center;margin:12px 0 0"><kbd>Space</kbd> start/stop &middot; <kbd>&uarr;</kbd><kbd>&darr;</kbd> change tempo &middot; <kbd>T</kbd> tap</p>
    </div>

    <div class="panel">
      <h2>Settings</h2>
      <div class="opts">
        <div><label class="f" for="beatsper">Beats per bar</label><select id="beatsper"></select></div>
        <div><label class="f" for="sub">Subdivision</label><select id="sub"><option value="1">None (quarter notes)</option><option value="2">Eighths (2 per beat)</option><option value="3">Triplets (3 per beat)</option><option value="4">Sixteenths (4 per beat)</option></select></div>
        <div><label class="f" for="sound">Sound</label><select id="sound"><option value="click">Click</option><option value="wood">Wood block</option><option value="beep">Beep</option></select></div>
        <div><label class="f" for="vol">Volume</label><input type="range" id="vol" min="0" max="100" value="70" aria-label="Volume"></div>
      </div>
      <div class="row" style="margin-top:14px"><label class="check"><input type="checkbox" id="accent" checked> Accent the first beat</label></div>
    </div>
  </main>

  <footer class="site">&copy; <span id="year"></span> Reece Haigh</footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var $ = function (id) { return document.getElementById(id); };

    var MIN = 30, MAX = 260;
    var bpm = 100, beats = 4, subdiv = 1, running = false;
    var ctx = null, nextTime = 0, curBeat = 0, curSub = 0, queue = [], ticker = null, raf = 0;
    var LOOKAHEAD = 0.2;    // seconds of audio scheduled in advance

    var store = {
      get: function (k) { try { return localStorage.getItem('metro.' + k); } catch (e) { return null; } },
      set: function (k, v) { try { localStorage.setItem('metro.' + k, v); } catch (e) {} }
    };

    // ---- UI ----
    var NAMES = [[40, 'Grave'], [60, 'Largo'], [66, 'Larghetto'], [76, 'Adagio'], [108, 'Andante'], [120, 'Moderato'], [156, 'Allegro'], [176, 'Vivace'], [200, 'Presto'], [1e9, 'Prestissimo']];
    function tempoName(b) { for (var i = 0; i < NAMES.length; i++) if (b < NAMES[i][0]) return NAMES[i][1]; return 'Prestissimo'; }

    (function () {
      var s = $('beatsper');
      for (var i = 1; i <= 12; i++) { var o = document.createElement('option'); o.value = i; o.textContent = i + (i === 4 ? ' (4/4)' : i === 3 ? ' (3/4)' : i === 6 ? ' (6/8 feel)' : ''); s.appendChild(o); }
    })();

    function drawBeats() {
      var box = $('beats'); box.textContent = '';
      for (var i = 0; i < beats; i++) { var d = document.createElement('span'); d.className = 'beat' + (i === 0 && $('accent').checked ? ' acc' : ''); box.appendChild(d); }
    }

    function setBpm(v, fromInput) {
      bpm = Math.max(MIN, Math.min(MAX, Math.round(+v) || bpm));
      $('bpmnum').textContent = bpm; $('temponame').textContent = tempoName(bpm);
      if (!fromInput) $('bpm').value = bpm;
      store.set('bpm', bpm);
    }

    // ---- audio ----
    function getCtx() {
      if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }

    var VOICES = {
      click: { type: 'square', hi: 1800, mid: 1300, lo: 900, dur: 0.03 },
      wood:  { type: 'triangle', hi: 1500, mid: 1050, lo: 760, dur: 0.05 },
      beep:  { type: 'sine', hi: 1046, mid: 784, lo: 587, dur: 0.09 }
    };

    function playNote(time, beat, sub) {
      var v = VOICES[$('sound').value] || VOICES.click, o = ctx.createOscillator(), g = ctx.createGain();
      var accent = beat === 0 && sub === 0 && $('accent').checked, main = sub === 0;
      var level = ($('vol').value / 100) * (accent ? 1 : main ? 0.7 : 0.38);
      o.type = v.type; o.frequency.value = accent ? v.hi : main ? v.mid : v.lo;
      g.gain.setValueAtTime(0.0001, time);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, level), time + 0.002);
      g.gain.exponentialRampToValueAtTime(0.0001, time + v.dur);
      o.connect(g); g.connect(ctx.destination);
      o.start(time); o.stop(time + v.dur + 0.02);
    }

    function schedule() {
      while (nextTime < ctx.currentTime + LOOKAHEAD) {
        playNote(nextTime, curBeat, curSub);
        queue.push({ t: nextTime, beat: curBeat, sub: curSub });
        nextTime += (60 / bpm) / subdiv;
        if (++curSub >= subdiv) { curSub = 0; curBeat = (curBeat + 1) % beats; }
      }
    }

    // A worker drives the scheduler so browsers don't throttle it in background tabs.
    function startTicker() {
      stopTicker();
      try {
        var url = URL.createObjectURL(new Blob(['setInterval(function(){postMessage(0)},25)'], { type: 'text/javascript' }));
        ticker = { w: new Worker(url) }; ticker.w.onmessage = function () { if (running) schedule(); };
      } catch (e) { ticker = { i: setInterval(function () { if (running) schedule(); }, 25) }; }
    }
    function stopTicker() { if (!ticker) return; if (ticker.w) ticker.w.terminate(); if (ticker.i) clearInterval(ticker.i); ticker = null; }

    function paint() {
      raf = requestAnimationFrame(paint);
      if (!ctx) return;
      var dots = $('beats').children, hit = null;
      while (queue.length && queue[0].t <= ctx.currentTime) { var q = queue.shift(); if (q.sub === 0) hit = q.beat; }
      if (hit !== null) {
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === hit);
        clearTimeout(paint.off); paint.off = setTimeout(function () { for (var j = 0; j < dots.length; j++) dots[j].classList.remove('on'); }, Math.min(180, 30000 / bpm));
      }
    }

    function start() {
      if (running || !getCtx()) return;
      running = true; queue = []; curBeat = 0; curSub = 0; nextTime = ctx.currentTime + 0.06;
      startTicker(); schedule();
      $('go').textContent = 'Stop'; $('go').classList.remove('btn-primary');
      cancelAnimationFrame(raf); paint();
    }
    function stop() {
      running = false; stopTicker(); cancelAnimationFrame(raf); queue = [];
      $('go').textContent = 'Start'; $('go').classList.add('btn-primary');
      Array.prototype.forEach.call($('beats').children, function (d) { d.classList.remove('on'); });
    }

    // ---- tap tempo ----
    var taps = [];
    function tap() {
      var now = performance.now();
      if (taps.length && now - taps[taps.length - 1] > 2000) taps = [];
      taps.push(now); if (taps.length > 6) taps.shift();
      if (taps.length >= 2) setBpm(60000 / ((taps[taps.length - 1] - taps[0]) / (taps.length - 1)));
    }

    // ---- wiring ----
    $('go').addEventListener('click', function () { running ? stop() : start(); });
    $('tap').addEventListener('pointerdown', function (e) { e.preventDefault(); tap(); });
    $('tap').addEventListener('keydown', function (e) { if (e.key === ' ' || e.key === 'Enter') e.preventDefault(); });
    $('bpm').addEventListener('input', function () { setBpm(this.value, true); });
    $('minus').addEventListener('click', function () { setBpm(bpm - 1); });
    $('plus').addEventListener('click', function () { setBpm(bpm + 1); });
    $('beatsper').addEventListener('change', function () { beats = +this.value; curBeat = 0; store.set('beats', beats); drawBeats(); });
    $('sub').addEventListener('change', function () { subdiv = +this.value; curSub = 0; store.set('sub', subdiv); });
    $('accent').addEventListener('change', function () { store.set('accent', this.checked ? '1' : '0'); drawBeats(); });
    $('sound').addEventListener('change', function () { store.set('sound', this.value); });
    $('vol').addEventListener('input', function () { store.set('vol', this.value); });

    document.addEventListener('keydown', function (e) {
      var tag = (e.target.tagName || '').toLowerCase();
      if (e.ctrlKey || e.metaKey || e.altKey || tag === 'input' && e.target.type !== 'range' || tag === 'textarea' || tag === 'select') return;
      var k = e.key;
      if ((k === ' ' && tag !== 'button')) { e.preventDefault(); running ? stop() : start(); }
      else if (k === 'ArrowUp') { e.preventDefault(); setBpm(bpm + (e.shiftKey ? 5 : 1)); }
      else if (k === 'ArrowDown') { e.preventDefault(); setBpm(bpm - (e.shiftKey ? 5 : 1)); }
      else if (k === 't' || k === 'T') { if (!e.repeat) tap(); }
    });

    // restore saved settings
    (function () {
      var v;
      if ((v = store.get('bpm'))) bpm = Math.max(MIN, Math.min(MAX, +v || 100));
      if ((v = store.get('beats'))) { beats = Math.max(1, Math.min(12, +v || 4)); }
      if ((v = store.get('sub'))) { subdiv = [1, 2, 3, 4].indexOf(+v) >= 0 ? +v : 1; }
      if ((v = store.get('sound')) && VOICES[v]) $('sound').value = v;
      if ((v = store.get('vol'))) $('vol').value = Math.max(0, Math.min(100, +v || 70));
      if (store.get('accent') === '0') $('accent').checked = false;
      $('beatsper').value = beats; $('sub').value = subdiv; setBpm(bpm); drawBeats();
    })();
    document.addEventListener('visibilitychange', function () { if (!document.hidden && running && ctx && ctx.state === 'suspended') ctx.resume(); });
  </script>
</body>
</html>
